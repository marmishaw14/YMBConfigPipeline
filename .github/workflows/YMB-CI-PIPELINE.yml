# This pipeline supports Ben Secure's audit requirement because by having configuration be deployed and monitored
# through a "controlled and auditable process" (OSFI B-13 section 2.5.3), it ensures that any changes are traceable and auditable.
# Using yamllint will also help ensure that the manifest will build and deploy properly and adhere to security standards.
# If the test fails, the push or pull request will not go through, allowing for the team responsible to mitigate and fix errors that are caught.
name: YMB Banking App CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: pytest test_main.py -v